<!doctype html>
<!--
  One page for both outputs:
    showcase.html?scene=contract&h=800   a still (render.mjs screenshots it)
    showcase.html?video                  the trailer; render.mjs calls window.seek(t) per frame
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>NgTrace showcase</title>
<script src="raw/boxes.js"></script>
<style>
  :root {
    --crimson: #d90a45;
    --magenta: #c21aa8;
    --ink: #160f22;
    --plum: #241433;
    --pink: #f3a6d6;
    --w: 1280px;
    --h: 800px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--ink); }
  body {
    width: var(--w);
    height: var(--h);
    overflow: hidden;
    font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: relative; width: var(--w); height: var(--h); overflow: hidden; background: linear-gradient(160deg, #1b1128 0%, var(--plum) 60%, #2a1036 100%); }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55; pointer-events: none; }
  .glow.a { width: 620px; height: 620px; left: -180px; top: -260px; background: var(--crimson); }
  .glow.b { width: 700px; height: 700px; right: -260px; top: 120px; background: var(--magenta); opacity: 0.4; }
  .grid {
    position: absolute; inset: 0; pointer-events: none; opacity: 0.07;
    background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at 50% 20%, #000 0%, transparent 70%);
  }

  .layer { position: absolute; inset: 0; }

  /* Feature scene */
  .copy { position: absolute; left: 0; right: 0; top: 44px; text-align: center; }
  .brand { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; color: var(--pink); padding: 5px 14px 5px 8px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); }
  .brand img { width: 20px; height: 20px; }
  .brand .dot { opacity: 0.5; }
  h1 { margin-top: 16px; font-size: 46px; line-height: 1.08; font-weight: 700; letter-spacing: -0.02em; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #ff3d7a, #e04bd0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 12px; font-size: 19px; color: rgba(255,255,255,0.68); }

  .window {
    position: absolute; left: 50%; transform-origin: 50% 0;
    width: 1120px; border-radius: 12px 12px 0 0; overflow: hidden;
    background: #202124;
    box-shadow: 0 40px 120px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.12), 0 -1px 0 rgba(255,255,255,0.18);
  }
  .bar { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #2b2b30; border-bottom: 1px solid #3a3a40; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .bar i:nth-child(1) { background: #ff5f57; } .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
  .tabs { display: flex; gap: 2px; margin-left: 18px; font-size: 12px; color: #9aa0a6; }
  .tabs span { padding: 6px 12px; border-radius: 6px 6px 0 0; }
  .tabs span.on { color: #e8eaed; background: #202124; box-shadow: inset 0 2px 0 var(--crimson); }
  .shot { position: relative; overflow: hidden; }
  .shot img { display: block; width: 100%; }
  .spot {
    position: absolute; border-radius: 8px; pointer-events: none;
    box-shadow: 0 0 0 4000px rgba(12, 6, 22, 0.58), 0 0 0 2px #ff4f8b, 0 0 32px 4px rgba(255, 60, 140, 0.55);
  }

  /* Intro / outro */
  .title-card { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .title-card img { width: 190px; height: 190px; filter: drop-shadow(0 20px 60px rgba(217, 10, 69, 0.5)); }
  .title-card .name { margin-top: 26px; font-size: 92px; font-weight: 700; letter-spacing: -0.03em; }
  .title-card .tag { margin-top: 8px; font-size: 28px; color: var(--pink); }
  .title-card .chips { margin-top: 34px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 980px; }
  .title-card .chips span { font-size: 17px; padding: 7px 16px; border-radius: 999px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.85); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="glow a" id="glowA"></div>
  <div class="glow b" id="glowB"></div>
  <div class="grid"></div>
</div>

<script>
  const SCENES = [
    { id: 'components', kicker: 'Component attribution', title: 'Every API call, traced to <em>its component</em>.', sub: 'The Angular component tree, with the requests each instance caused and why.' },
    { id: 'timeline', kicker: 'Timeline', title: 'Every request <em>on a timeline</em>.', sub: 'Router navigations and route phases marked. Zoom and scroll through time.' },
    { id: 'errors', kicker: 'Errors & retries', title: 'Failures, retries and <em>recoveries</em>.', sub: 'Retry chains linked attempt by attempt, with a per-component summary.' },
    { id: 'waste', kicker: 'Waste detector', title: 'Catch <em>duplicate</em> and <em>cancelled</em> calls.', sub: 'See which components waste the most time on the network.' },
    { id: 'interceptors', kicker: 'Interceptor chain', title: 'Step through your <em>interceptors</em>.', sub: 'What each one changed, short-circuits, and the retries it started.' },
    { id: 'tokens', kicker: 'JWT inspector', title: 'Decode tokens, with a <em>live expiry</em>.', sub: 'Found in headers, cookies, query strings and JSON bodies.' },
    { id: 'contract', kicker: 'Contract & drift', title: 'Infer response shapes. <em>Flag drift.</em>', sub: "Copy any endpoint's contract as TypeScript interfaces." },
    { id: 'replay', kicker: 'Replay', title: '<em>Edit & resend</em> any request.', sub: 'Change headers, query or body, and diff the new response.' },
    { id: 'mocks', kicker: 'Mocking', title: 'Mock responses, <em>no code changes</em>.', sub: 'Respond, delay or fail. Rules apply only while the panel is open.' },
    { id: 'signals', kicker: 'Signals & resources', title: 'Signals, resources and <em>value history</em>.', sub: 'Scrub back to the values from just before a request was sent.' },
  ];
  const CHIPS = ['Component attribution', 'Timeline', 'Retries', 'Waste', 'Interceptors', 'JWT', 'Contracts', 'Replay', 'Mocks', 'Signals', 'Export to Postman & Playwright'];

  const params = new URLSearchParams(location.search);
  const W = 1280;
  const H = +(params.get('h') ?? (params.has('video') ? 720 : 800));
  document.documentElement.style.setProperty('--h', H + 'px');
  const stage = document.getElementById('stage');
  const WIN_W = H >= 800 ? 1120 : 1040;
  const WIN_TOP = H >= 800 ? 212 : 196;

  function featureLayer(scene) {
    const box = BOXES[scene.id];
    const k = WIN_W / box.width;
    const f = box.focus;
    const el = document.createElement('div');
    el.className = 'layer';
    el.innerHTML = `
      <div class="copy">
        <span class="brand"><img src="../store/logo-1024.png" alt="" />NgTrace <span class="dot">·</span> ${scene.kicker}</span>
        <h1>${scene.title}</h1>
        <p class="sub">${scene.sub}</p>
      </div>
      <div class="window" style="width:${WIN_W}px; margin-left:${-WIN_W / 2}px; top:${WIN_TOP}px">
        <div class="bar"><i></i><i></i><i></i>
          <div class="tabs"><span>Elements</span><span>Console</span><span>Network</span><span class="on">NgTrace</span></div>
        </div>
        <div class="shot">
          <img src="raw/${scene.id}.png" alt="" />
          ${f ? `<div class="spot" style="left:${f.x * k + 3}px; top:${f.y * k + 3}px; width:${f.width * k - 6}px; height:${f.height * k - 6}px"></div>` : ''}
        </div>
      </div>`;
    stage.appendChild(el);
    return {
      el,
      copy: el.querySelector('.copy'),
      win: el.querySelector('.window'),
      spot: el.querySelector('.spot'),
      // Window-local point the camera pushes in towards: the focus centre horizontally, the window's
      // top edge vertically so the zoom never grows up over the headline.
      origin: { x: f ? (f.x + f.width / 2) * k : WIN_W / 2, y: 0 },
    };
  }

  function titleLayer(outro) {
    const el = document.createElement('div');
    el.className = 'layer title-card';
    el.innerHTML = `
      <img src="../store/logo-1024.png" alt="" />
      <div class="name">NgTrace</div>
      <div class="tag">${outro ? 'Requests by component, in DevTools.' : 'The network inspector Angular deserves.'}</div>
      ${outro ? `<div class="chips">${CHIPS.map((c) => `<span>${c}</span>`).join('')}</div>` : ''}`;
    stage.appendChild(el);
    return { el, logo: el.querySelector('img'), name: el.querySelector('.name'), tag: el.querySelector('.tag'), chips: [...el.querySelectorAll('.chips span')] };
  }

  const clamp = (v) => Math.max(0, Math.min(1, v));
  const ramp = (t, a, b) => clamp((t - a) / (b - a));
  const ease = (x) => 1 - Math.pow(1 - x, 3);
  const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

  function poseFeature(L, u, dur) {
    const a = ease(ramp(u, 0, 0.45));
    L.copy.style.opacity = a;
    L.copy.style.transform = `translateY(${(1 - a) * 18}px)`;
    const w = ease(ramp(u, 0.05, 0.6));
    // Slow push-in towards the focus while the scene holds.
    const z = 1 + 0.16 * inOut(ramp(u, 0.7, dur));
    L.win.style.transformOrigin = `${L.origin.x}px ${L.origin.y}px`;
    L.win.style.transform = `translateY(${(1 - w) * 60}px) scale(${z})`;
    L.win.style.opacity = w;
    if (L.spot) L.spot.style.opacity = ease(ramp(u, 0.55, 0.95));
  }

  function poseTitle(L, u) {
    const a = ease(ramp(u, 0, 0.6));
    L.logo.style.opacity = a;
    L.logo.style.transform = `scale(${0.7 + 0.3 * a}) rotate(${(1 - a) * -12}deg)`;
    const n = ease(ramp(u, 0.25, 0.8));
    L.name.style.opacity = n;
    L.name.style.transform = `translateY(${(1 - n) * 24}px)`;
    const g = ease(ramp(u, 0.5, 1.05));
    L.tag.style.opacity = g;
    L.tag.style.transform = `translateY(${(1 - g) * 16}px)`;
    L.chips.forEach((c, i) => {
      const v = ease(ramp(u, 0.7 + i * 0.06, 1.1 + i * 0.06));
      c.style.opacity = v;
      c.style.transform = `translateY(${(1 - v) * 12}px)`;
    });
  }

  if (!params.has('video')) {
    const scene = SCENES.find((s) => s.id === params.get('scene')) ?? SCENES[0];
    const L = featureLayer(scene);
    poseFeature(L, 10, 99);
  } else {
    const INTRO = 2.5, SCENE = 2.5, OUTRO = 2.5, FADE = 0.3;
    const timeline = [{ kind: 'title', layer: titleLayer(false), dur: INTRO }];
    for (const s of SCENES) timeline.push({ kind: 'feature', layer: featureLayer(s), dur: SCENE });
    timeline.push({ kind: 'title', layer: titleLayer(true), dur: OUTRO, last: true });
    let t0 = 0;
    for (const item of timeline) { item.start = t0; t0 += item.dur; }
    window.DURATION = t0;

    window.seek = (t) => {
      document.getElementById('glowA').style.transform = `translate(${Math.sin(t / 5) * 60}px, ${Math.cos(t / 6) * 40}px)`;
      document.getElementById('glowB').style.transform = `translate(${Math.cos(t / 4) * 70}px, ${Math.sin(t / 7) * 50}px)`;
      for (const item of timeline) {
        const u = t - item.start;
        // Visible from its start until the next item has fully faded in over it.
        const visible = u >= 0 && u < item.dur + FADE;
        item.layer.el.style.display = visible ? '' : 'none';
        if (!visible) continue;
        const fadeIn = item.start === 0 ? 1 : ramp(u, 0, FADE);
        // The outgoing layer fades out as the next one fades in; the last one holds.
        const fadeOut = item.last ? 1 : 1 - ramp(u, item.dur, item.dur + FADE);
        item.layer.el.style.opacity = Math.min(fadeIn, fadeOut);
        item.layer.el.style.zIndex = u >= item.dur ? 1 : 2;
        if (item.kind === 'feature') poseFeature(item.layer, Math.min(u, item.dur), item.dur);
        else poseTitle(item.layer, u);
      }
    };
    window.seek(0);
  }
</script>
</body>
</html>
